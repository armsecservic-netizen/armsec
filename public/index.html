<title>ArmSec Security Catalog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky control bar over a camera-viewfinder hero, then filter rail + dense product grid; cart drawer and assistant float on the right edge */
:root{
  
  --bg:#f2f4f6; --surface:#ffffff; --sunken:#e8ecf0; --ink:#0b1a30; --muted:#5a6774; --line:#d9e0e7;
  --accent:#1662d6; --accent-ink:#ffffff; --accent-soft:#e3edfc; --promo:#d4361f; --promo-soft:#fbe4df;
  --rec:#e2402b; --shadow:0 10px 30px rgba(15,27,38,.12);
  --f-display:"Unbounded","Noto Sans Armenian",system-ui,sans-serif;
  --f-body:"Onest","Noto Sans Armenian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --logo-shield:#e5ecf2; --logo-face:#0c1116; --bg:#07101d; --surface:#0e192a; --sunken:#0a1422; --ink:#e5ecf2; --muted:#93a0ad; --line:#1e2d43;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#0f2744; --promo:#ff6a52; --promo-soft:#3a1a14;
  --rec:#ff5a45; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --logo-shield:#e5ecf2; --logo-face:#0c1116; --bg:#07101d; --surface:#0e192a; --sunken:#0a1422; --ink:#e5ecf2; --muted:#93a0ad; --line:#1e2d43;
  --accent:#4aa3ff; --accent-ink:#04121f; --accent-soft:#0f2744; --promo:#ff6a52; --promo-soft:#3a1a14;
  --rec:#ff5a45; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.logo{width:32px;height:35px;display:block;flex:none}
.brand b,.adm-top b{letter-spacing:.01em}.brand b i,.adm-top b i{font-style:normal;color:var(--accent)}
.adm-top .logo{--logo-shield:#f2f5f8;--logo-face:#0f1b26}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em;display:block;line-height:1}
.brand small{font-size:11px;color:var(--muted);display:block;margin-top:3px}
nav.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.links a{padding:8px 11px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
nav.links a:hover{background:var(--sunken)}
.langs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.langs button{border:0;background:none;padding:6px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.cart-btn{display:flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);padding:8px 13px;border-radius:9px;font-weight:600;font-size:14px;flex:none}
.cart-btn .n{background:var(--accent-ink);color:var(--accent);border-radius:20px;min-width:20px;padding:0 6px;font-size:12px;line-height:20px;text-align:center}
@media (max-width:900px){nav.links{display:none}.brand small{display:none}}
@media (max-width:560px){.top .wrap{gap:8px}.cart-btn span:first-child{display:none}.cart-btn{padding:8px 10px}.cart-btn::before{content:"∑";font-weight:700}.langs button{padding:6px 7px;font-size:11px}.brand b{font-size:15px}.brand-mark{width:30px;height:30px}.langs{margin-left:auto}}

/* hero */
.hero{padding-block:36px 28px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.2vw,46px);line-height:1.08;letter-spacing:-.015em}
.hero p.lead{color:var(--muted);font-size:17px;max-width:54ch;margin:14px 0 22px}
.search{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;max-width:560px}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 10px;font-size:16px}
.search input:focus{outline:none}
.search button{border:0;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 16px;font-weight:600}
.hero-facts{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hero-facts div b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.hero-facts div span{font-size:13px;color:var(--muted)}
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sunken);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.viewfinder .grid4{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line)}
.viewfinder .cell{background:var(--surface);display:grid;place-items:center;position:relative;overflow:hidden}
.viewfinder .cell img{width:70%;height:70%;object-fit:contain;mix-blend-mode:multiply}
:root[data-theme="dark"] .viewfinder .cell img{mix-blend-mode:normal}
.viewfinder .cell span{position:absolute;left:8px;bottom:6px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.osd{position:absolute;left:10px;top:8px;right:10px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--ink);z-index:2;pointer-events:none}
.osd .rec{color:var(--rec);font-weight:700}
.osd .rec::before{content:"●";margin-right:4px;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.corner{position:absolute;width:18px;height:18px;border:2px solid var(--accent);z-index:2}
.c1{left:6px;top:28px;border-right:0;border-bottom:0}.c2{right:6px;top:28px;border-left:0;border-bottom:0}
.c3{left:6px;bottom:6px;border-right:0;border-top:0}.c4{right:6px;bottom:6px;border-left:0;border-top:0}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.viewfinder{display:none}}

/* domains */
.domains{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.domains button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px}
.domains button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.domains button.promo-d{color:var(--promo);border-color:var(--promo)}
.domains button.promo-d[aria-pressed="true"]{background:var(--promo);color:#fff}

section.block{padding-block:28px}

.arts b{font-size:15px;text-wrap:balance}.arts span{font-size:13px;color:var(--muted)}
.reader{white-space:pre-wrap;line-height:1.6;font-size:15px}
.ttag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--ink);color:var(--surface);margin-left:6px}
.quote{align-self:stretch;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:13px}
.quote h4{margin:0;font-size:14px}.quote table{width:100%;border-collapse:collapse}
.quote td{padding:4px 2px;border-bottom:1px solid var(--line);vertical-align:top}.quote td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.quote .tot{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.quote .acts{display:flex;gap:6px;flex-wrap:wrap}.quote .acts button{padding:6px 10px;font-size:12.5px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cats button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-rows:96px auto auto;gap:6px;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.cats button:hover{border-color:var(--accent);transform:translateY(-2px)}
.cats .ci{background:#fff;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.cats .ci img{max-width:86%;max-height:86px;object-fit:contain}
.cats b{font-size:14px;line-height:1.25}.cats span{font-size:12px;color:var(--muted)}
.pg-off{display:none!important}
nav.links a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap}.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.pbanner{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:center;background:var(--ink);color:var(--bg);border-radius:16px;padding:20px 22px;margin-bottom:22px;text-decoration:none;overflow:hidden;position:relative}
.pbanner::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--promo);opacity:.18}
.pbanner .pt{display:grid;gap:6px;position:relative;z-index:1}
.pbanner .pt .label{color:var(--promo);opacity:1}
.pbanner b{font-family:var(--f-display);font-size:clamp(20px,2.6vw,30px);line-height:1.1}
.pbanner .pt span.s{font-size:14px;opacity:.8}
.pbanner .go{justify-self:start;background:var(--promo);color:#fff;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;margin-top:6px}
.pbanner .pimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.pbanner .pimgs div{background:#fff;border-radius:10px;aspect-ratio:1;display:grid;place-items:center;position:relative}
.pbanner .pimgs img{max-width:84%;max-height:84%;object-fit:contain}
.pbanner .pimgs em{position:absolute;left:6px;top:6px;background:var(--promo);color:#fff;font-style:normal;font-weight:700;font-size:12px;padding:1px 6px;border-radius:5px}
@media (max-width:700px){.pbanner{grid-template-columns:1fr}}
.subchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.subchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.subchips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* product page */
.pp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:860px){.pp{grid-template-columns:1fr;gap:18px}}
.pp-img{background:#fff;border:1px solid var(--line);border-radius:16px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;overflow:hidden;position:relative;cursor:zoom-in}
.pp-img img{width:86%;height:86%;object-fit:contain;transition:transform .25s ease}
.pp-img:hover img{transform:scale(1.7)}
.pp-info{display:grid;gap:14px;align-content:start;min-width:0}
.pp-info h1{font-family:var(--f-mono);font-size:clamp(20px,2.6vw,28px);font-weight:500;word-break:break-word}
.pp-series{color:var(--muted);font-size:14px}
.pp-chips{display:flex;gap:6px;flex-wrap:wrap}.pp-chips span{background:var(--sunken);border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600}
.pp-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.pp-price b{font-family:var(--f-display);font-size:32px;font-variant-numeric:tabular-nums}.pp-price b.p{color:var(--promo)}
.pp-buy{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pp-buy .qty input{width:56px;padding:8px}.pp-buy .qty button{width:38px;height:38px;font-size:18px}
.pp-specs{margin:0;padding:0;list-style:none;display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pp-specs li{padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}.pp-specs li:last-child{border-bottom:0}.pp-specs li:nth-child(odd){background:var(--bg)}
.pp-note{font-size:13px;color:var(--muted);display:grid;gap:4px}
.pp h2{font-family:var(--f-display);font-size:20px;margin:28px 0 12px}
.card .ph,.card .model{cursor:pointer}
.card .ph img{transition:transform .3s ease}.card:hover .ph img{transform:scale(1.06)}
.card{transition:box-shadow .2s,border-color .2s}.card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 8px 24px rgba(15,27,38,.08)}
/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:-4px 0 14px;font-size:13.5px}
.filters input[type=number]{width:110px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}
.filters label.tg{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer}
.filters .reset{border:0;background:none;color:var(--accent);font-weight:600;padding:4px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:85;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:toastIn .25s ease-out}
.toast img{width:40px;height:32px;object-fit:contain;background:#fff;border-radius:6px}
.toast span{font-size:13.5px;min-width:0}.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 11px;font-weight:700;white-space:nowrap}
@keyframes toastInM{from{transform:translateY(12px);opacity:.4}}
@keyframes toastIn{from{transform:translate(-50%,12px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.cart-btn.bump{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.12)}60%{transform:scale(.96)}}
/* hero animation */
.viewfinder .scan{position:absolute;left:0;right:0;height:38%;top:-40%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 16%,transparent) 85%,color-mix(in srgb,var(--accent) 55%,transparent));z-index:2;pointer-events:none;animation:scan 4.2s linear infinite}
@keyframes scan{to{top:105%}}
.viewfinder .mbox{position:absolute;width:22%;height:30%;border:2px solid var(--rec);border-radius:4px;z-index:3;pointer-events:none;animation:mbox 12s ease-in-out infinite}
.viewfinder .mbox::after{content:"MOTION";position:absolute;left:-2px;top:-18px;background:var(--rec);color:#fff;font:700 9px/1 var(--f-mono);padding:3px 5px;border-radius:3px 3px 0 0;letter-spacing:.06em}
@keyframes mbox{0%,18%{left:14%;top:18%}25%,43%{left:63%;top:14%}50%,68%{left:16%;top:60%}75%,93%{left:62%;top:58%}100%{left:14%;top:18%}}
.viewfinder .cell{transition:background .3s}
/* icons, brands, recent, footer */
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brands{display:flex;gap:10px 34px;flex-wrap:wrap;align-items:center;justify-content:center;padding:18px;border:1px dashed var(--line);border-radius:14px}
.brands span{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--muted)}
.brands em{font-style:normal;font-size:12.5px;color:var(--muted);width:100%;text-align:center}
.recent{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,220px);gap:12px;overflow-x:auto;padding-bottom:6px}
footer.site .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:16px;width:100%}
@media (max-width:760px){footer.site .cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer.site .cols b{display:block;color:var(--ink);margin-bottom:8px;font-size:14px}
footer.site .cols a{display:block;color:var(--muted);text-decoration:none;padding:3px 0}footer.site .cols a:hover{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.viewfinder .scan,.viewfinder .mbox{display:none}}

.brand-band .btx{padding:28px 28px 28px 0;display:grid;gap:14px;align-content:center}
.brand-band h2{font-family:var(--f-display);font-size:clamp(22px,3vw,32px);letter-spacing:.04em}.brand-band h2 i{font-style:normal;color:#4aa3ff}
.brand-band p{margin:0;opacity:.85;font-size:15px;max-width:52ch}
.brand-band .acts{display:flex;gap:10px;flex-wrap:wrap}
.brand-band .ghost{background:transparent;color:#e8f0fb;border-color:rgba(232,240,251,.35)}
@media (max-width:760px){.brand-band{grid-template-columns:1fr}.brand-band .btx{padding:0 20px 24px}.brand-band .bimg{aspect-ratio:16/10}}
.hero .wrap>div{min-width:0}.search{width:100%}
/* ===== welcome hero ===== */
.hx{position:relative;overflow:hidden;background:#061428;color:#eaf2ff;padding-block:64px 72px;isolation:isolate}
.hx::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 75% 40%,rgba(30,123,255,.28),transparent 70%),radial-gradient(40% 60% at 10% 100%,rgba(30,123,255,.14),transparent 70%);z-index:-1}
.hx-art{position:absolute;top:0;bottom:0;right:0;width:min(60%,860px);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%);mask-image:linear-gradient(90deg,transparent 0,#000 42%);z-index:-1;animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
#netfx{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hx .wrap{display:block}
.hx-txt{max-width:620px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.hx-txt>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hx-txt>*:nth-child(2){animation-delay:.06s}.hx-txt>*:nth-child(3){animation-delay:.12s}.hx-txt>*:nth-child(4){animation-delay:.18s}.hx-txt>*:nth-child(5){animation-delay:.24s}.hx-txt>*:nth-child(6){animation-delay:.3s}.hx-txt>*:nth-child(7){animation-delay:.36s}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
.hx-badge{justify-self:start;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-size:13px;backdrop-filter:blur(6px)}
.hx-badge .dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.hx .label{color:#7cb8ff}
.hx h1{font-family:var(--f-display);font-size:clamp(32px,5.2vw,60px);line-height:1.04;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 30px rgba(6,20,40,.6)}
.hx p.lead,.hero.hx p.lead{color:rgba(234,242,255,.86);font-size:clamp(15px,1.6vw,18px);margin:0;max-width:56ch}
.hx-cta{display:flex;gap:12px;flex-wrap:wrap}
.hx-primary{border:0;background:linear-gradient(180deg,#2b8bff,#1662d6);color:#fff;font-weight:700;font-size:16px;padding:14px 22px;border-radius:12px;box-shadow:0 10px 30px rgba(30,123,255,.45);display:flex;gap:10px;align-items:center}
.hx-primary:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(30,123,255,.55)}
.hx-ghost{display:flex;align-items:center;gap:8px;color:#eaf2ff;text-decoration:none;font-weight:600;font-size:16px;padding:13px 20px;border-radius:12px;border:1px solid rgba(234,242,255,.3);background:rgba(255,255,255,.04)}
.hx-ghost:hover{background:rgba(255,255,255,.1)}
.hx .search{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.hx .search input{color:#fff}.hx .search input::placeholder{color:rgba(234,242,255,.55)}
.hx .search button{background:#fff;color:#061428}
.hx .paths a{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#eaf2ff;backdrop-filter:blur(6px)}.hx .paths a span{color:rgba(234,242,255,.65)}.hx .paths a:hover{border-color:#4aa3ff}
.hx .paths{margin-top:0}
.hx .hero-facts{margin-top:4px;gap:30px}.hx .hero-facts b{color:#fff;font-size:26px}.hx .hero-facts span{color:rgba(234,242,255,.65)}
@media (max-width:820px){.hx{padding-block:40px 48px}.hx-art{width:100%;opacity:.38;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 85%);mask-image:linear-gradient(180deg,#000 0,transparent 85%)}}
@media (prefers-reduced-motion:reduce){.hx-art,.hx-txt>*,.hx-badge .dot{animation:none}}
/* quiz + animated CTA */
.hx-primary{position:relative;overflow:hidden}
.hx-primary::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.hx-primary{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 10px 40px rgba(43,139,255,.75)}}
.hx-sub{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(234,242,255,.8);margin-top:-6px}
.hx-sub b{color:#7cb8ff;font-weight:600}
.quiz{width:min(620px,100%)}
.qz-bar{height:6px;background:var(--sunken);border-radius:6px;overflow:hidden}.qz-bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.qz-step{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.qz-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.qz-opts{grid-template-columns:1fr}}
.qz-opts button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center;transition:border-color .15s,background .15s,transform .15s}
.qz-opts button:hover{border-color:var(--accent);transform:translateY(-1px)}
.qz-opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qz-opts button span.e{font-size:20px}
.qz-nav{display:flex;justify-content:space-between;gap:10px}
.qz-ok{display:grid;gap:12px;text-align:center;justify-items:center;padding:10px 0}
.qz-ok .big{font-size:44px}

.hx-glow{position:absolute;left:50%;top:37%;width:46%;height:46%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(80,170,255,.55),rgba(30,123,255,.18) 45%,transparent 70%);mix-blend-mode:screen;animation:breathe 3.6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.9)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}}
.hx-art::after{content:"";position:absolute;top:-10%;bottom:-10%;width:22%;left:-30%;background:linear-gradient(100deg,transparent,rgba(160,210,255,.28),transparent);transform:skewX(-18deg);animation:sweep 7s ease-in-out infinite;mix-blend-mode:screen}
@keyframes sweep{0%,60%{left:-30%}100%{left:120%}}
.hx-txt{max-width:580px}
@media (max-width:820px){.hx-art{opacity:.38;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 92%);mask-image:linear-gradient(180deg,#000 0,transparent 92%)}}
@media (prefers-reduced-motion:reduce){.hx-img,.hx-glow,.hx-art::after{animation:none}}
/* section imagery */
.sec-head.banner{position:relative;min-height:230px;align-items:flex-end;border-radius:18px;overflow:hidden;padding:30px;margin-bottom:22px;background:linear-gradient(90deg,rgba(6,20,40,.94) 0,rgba(6,20,40,.6) 55%,rgba(6,20,40,.12)),url(/bg/services.webp) center/cover no-repeat}
.sec-head.banner h2{font-size:clamp(24px,3.4vw,40px);color:#fff;max-width:20ch}.sec-head.banner p{color:rgba(234,242,255,.86);max-width:52ch}
.sec-head.banner.b-glass{background:#eef2f8}.sec-head.banner.b-glass>*{position:relative;z-index:1}.sec-head.banner.b-glass::after{content:"";position:absolute;top:0;right:0;bottom:0;width:48%;background:url(/bg/glass.webp) center 42%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%)}
.sec-head.banner.b-glass h2{color:#0b1a30}.sec-head.banner.b-glass p{color:#3b4a5e}
#partners.dark-sec{background:linear-gradient(90deg,rgba(6,20,40,.95) 0,rgba(6,20,40,.78) 50%,rgba(6,20,40,.55)),url(/bg/room.webp) center/cover no-repeat;color:#eaf2ff;padding-block:56px}
#partners.dark-sec h2{color:#fff}#partners.dark-sec .label{color:#7cb8ff}#partners.dark-sec .note,#partners.dark-sec .pben span{color:rgba(234,242,255,.78)}#partners.dark-sec .pben b{color:#fff}#partners.dark-sec .pben i{background:#1e7bff;color:#fff}
#partners.dark-sec form.lead{box-shadow:0 20px 50px rgba(0,0,0,.35);color:var(--ink)}#partners.dark-sec form.lead h3{color:var(--ink)}#partners.dark-sec .okbox{color:var(--ink)}
#contact .info{background:linear-gradient(180deg,rgba(6,20,40,.82),rgba(6,20,40,.95)),url(/bg/net.webp) center/cover no-repeat;color:#eaf2ff}
.pbanner{background:linear-gradient(90deg,rgba(6,16,30,.93) 0,rgba(6,16,30,.62) 58%,rgba(6,16,30,.3)),url(/bg/burst.webp) center/cover no-repeat}
.qz-hero{height:130px;margin:-20px -20px 4px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,var(--surface)),url(/bg/gold.webp) center 40%/cover no-repeat}
@media (max-width:700px){.sec-head.banner{min-height:180px;padding:20px}.sec-head.banner.b-glass{background:#eef2f8}.sec-head.banner.b-glass::after{width:60%;opacity:.55}}
/* rotating promo banner */
.pbanner .pimgs{overflow:hidden}
.pbanner .pimgs div{transition:opacity .45s ease,transform .45s ease}
.pbanner .pimgs.swap div{opacity:0;transform:translateY(10px) scale(.97)}
.pbanner .pimgs .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(6,16,30,.85));color:#fff;font-size:11.5px;padding:16px 8px 6px;border-radius:0 0 10px 10px;display:grid;gap:1px}
.pbanner .pimgs .cap s{opacity:.7;font-size:10.5px}.pbanner .pimgs .cap b{font-family:var(--f-body);font-size:13px}
.pbanner .dots{display:flex;gap:5px;margin-top:4px}.pbanner .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}.pbanner .dots i.on{background:#fff;width:16px;border-radius:4px}
.bot-status{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.bot-status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping2 1s infinite}
@keyframes ping2{50%{opacity:.25}}
/* system configurator */
.cfg{width:min(640px,100%)}
.cfg-row{display:grid;gap:8px}
.cfg-row>b{font-size:14px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chips2 button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;transition:border-color .15s,background .15s}
.chips2 button:hover{border-color:var(--accent)}
.chips2 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cfg-sum{background:var(--sunken);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.cfg-sum b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
/* contacts with icons + floating messengers */
.crows{display:grid;gap:8px}
.crow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:inherit;text-decoration:none;transition:background .15s,transform .15s}
a.crow:hover{background:rgba(255,255,255,.12);transform:translateX(3px)}
.crow .ci2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none}
.crow .ci2 svg{width:22px;height:22px}
.crow.wa .ci2,.crow.vb .ci2,.crow.tg .ci2{background:#fff}
.crow .ct{display:grid;min-width:0}.crow .ct small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.65}.crow .ct b{font-size:16px;user-select:all;word-break:break-word}
.floatc{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:10px}
.floatc .fc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.25);transition:transform .15s}
.floatc .fc:hover{transform:scale(1.08)}
.floatc .fc svg{width:30px;height:30px}
.floatc .wa{background:#25D366}.floatc .vb{background:#7360F2}
.floatc .wa svg path:first-child{fill:#25D366}.floatc .wa svg path:nth-child(2){fill:#fff}.floatc .wa svg path:nth-child(3){fill:#25D366}
.floatc .vb svg rect{fill:#7360F2}
body.is-admin .floatc{display:none}
@media (max-width:560px){.floatc .fc{width:46px;height:46px}.floatc .fc svg{width:26px;height:26px}}
nav.links{flex-wrap:nowrap;gap:2px}nav.links a{white-space:nowrap;padding:8px 10px}
@media (max-width:1280px){nav.links a{padding:7px 8px;font-size:13.5px}}
@media (max-width:1100px){.brand small{display:none}}
/* ===== mobile ===== */
.burger{display:none;border:0;background:var(--sunken);width:40px;height:40px;border-radius:10px;flex:none;align-items:center;justify-content:center}
.burger span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;position:relative}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--ink);border-radius:2px}
.burger span::before{top:-6px}.burger span::after{top:6px}
.mmenu{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:49;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 16px 30px rgba(0,0,0,.15);padding:8px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));display:grid;gap:2px;max-height:calc(100vh - 70px);overflow:auto;animation:mdrop .18s ease-out}
@keyframes mdrop{from{transform:translateY(-8px);opacity:.6}}
.mmenu a{padding:13px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;display:flex;justify-content:space-between}
.mmenu a::after{content:"›";color:var(--muted)}
.mmenu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.mbar{display:none}
@media (max-width:900px){.burger{display:flex}}
@media (max-width:760px){
  .mbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:68;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
  .mbar a,.mbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink);text-decoration:none;padding:4px 2px;position:relative}
  .mbar .mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
  .mbar .mi svg{width:22px;height:22px}
  .mbar .wa .mi{background:#25D366}.mbar .vb .mi{background:#7360F2}.mbar .ai .mi{background:var(--accent);color:#fff;font-size:12px;font-weight:800}.mbar .ct .mi{background:var(--ink);color:var(--surface)}
  .mbar .wa svg path:first-child{fill:#25D366}.mbar .wa svg path:nth-child(2){fill:#fff}.mbar .wa svg path:nth-child(3){fill:#25D366}.mbar .vb svg rect{fill:#7360F2}
  .mbar .ct em{position:absolute;top:0;right:calc(50% - 22px);background:var(--promo);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .fab,.floatc{display:none!important}
  .greet{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .toast{left:12px;right:12px;transform:none;max-width:none;animation:toastInM .25s ease-out}
  .toast span{flex:1;font-size:13px;overflow-wrap:anywhere}
  input,select,textarea{font-size:16px!important}
  .bot input:focus,.bot textarea:focus{outline:none}
  .bot{right:0;left:0;bottom:0;top:0;width:100%;height:100%;border-radius:0;z-index:90}
  /* header */
  .top .wrap{gap:8px;padding-block:8px}
  .langs button{padding:6px 7px}
  .cart-btn{display:none}
  /* hero */
  .hx{padding-block:28px 34px}
  .hx .label,.hx .paths{display:none}
  .hx h1{font-size:clamp(28px,8vw,36px)}
  .hx p.lead{font-size:15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .hx-badge{font-size:12px}
  .hx-primary{font-size:15px;padding:13px 16px;justify-content:center;width:100%}
  .hx-cta{display:grid;grid-template-columns:1fr}
  .hx-ghost{justify-content:center}
  .hx .hero-facts b{font-size:22px}
  section.block{padding-block:20px}
  .sec-head h2{font-size:21px}
  /* benefits 2 columns */
  .why{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .why div{padding:12px;gap:4px}.why b{font-size:13.5px}.why span{font-size:12px}
  /* product grid 2 columns */
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card .body{padding:8px 9px 10px;gap:4px}
  .card .model{font-size:11.5px}
  .card .desc{-webkit-line-clamp:2;font-size:11.5px}
  .card .more{display:none}
  .card .foot{flex-direction:column;align-items:stretch;gap:6px}
  .card .price{font-size:15px}
  .card .add{padding:7px 6px;font-size:12px;text-align:center}
  .chip{font-size:9.5px}.badge{font-size:11px}
  .promo-strip{grid-auto-columns:minmax(160px,170px)}
  .recent{grid-auto-columns:minmax(160px,170px)}
  /* catalog tools */
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toolbar .count{grid-column:1/-1}
  .toolbar select{width:100%;min-width:0}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .filters input[type=number],.filters select{width:100%;min-width:0}
  .filters label.tg{justify-content:center}
  .group-title{font-size:12px}
  /* promo banner */
  .pbanner{padding:16px;gap:12px;margin-bottom:14px}
  .pbanner b{font-size:22px}.pbanner .pt span.s{font-size:13px}
  .pbanner .pimgs{gap:6px}
  .pbanner .pimgs .cap .mono,.pbanner .pimgs .cap s{display:none}
  .pbanner .pimgs .cap b{font-size:12px}
  /* product page */
  .pp-img{aspect-ratio:4/3}
  .pp-price b{font-size:26px}
  .pp-buy{display:grid;grid-template-columns:auto 1fr}
  .pp-buy .ghost{grid-column:1/-1}
  /* categories */
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cats button{grid-template-rows:80px auto auto;padding:10px}
  .cats b{font-size:13px}
  /* modals full width */
  .modal{padding:0;align-items:end}
  .modal-box{border-radius:18px 18px 0 0;max-height:92vh;width:100%!important;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .qz-hero{margin:-18px -16px 4px;border-radius:18px 18px 0 0;height:100px}
  .drawer{width:100%}
}
footer.site{border-top:1px solid var(--line);padding-block:24px 90px;color:var(--muted);font-size:13px}
footer.site .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>


<header class="top pub">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"><span class="logo" aria-hidden="true"></span><span><b class="wm">ARM-<i>SEC</i></b><small data-t="tagline"></small></span></a>
    <nav class="links" aria-label="Main">
      <a href="#catalog" data-t="nCatalog"></a>
      <a href="#promo" data-t="nPromo"></a>
      <a href="#services" data-t="nServices"></a>
      <a href="#partners" data-t="nPartners"></a>
      <a href="#knowledge" data-t="nKnow"></a>
      <a href="#contact" data-t="nContact"></a>

    <button class="burger" id="burger" type="button" aria-label="Menu"><span></span></button>
    <button class="cart-btn" id="openEst"><span data-t="estimate"></span><span class="n" id="estN">0</span></button>

</header>

<main id="top" class="pub">
  <section class="hero hx" data-page="home">
    <canvas id="netfx" aria-hidden="true"></canvas>
    <div class="hx-art" aria-hidden="true"><div class="hx-img"></div><span class="hx-glow"></span></div>

        <p class="lead" data-t="heroLead"></p>
        <div class="hx-cta"><button class="hx-primary" type="button" id="hxBot"></button><a class="hx-ghost" href="#catalog" id="hxCat"></a></div>
        <div class="hx-sub"><span>✓</span><span id="hxSub"></span></div>
        <form class="search" id="heroSearch" role="search">
          <input id="q" type="search" autocomplete="off" data-ph="searchPh">
          <button type="submit" data-t="find"></button>
        </form>
        <div class="paths">
          <a href="#solutions"><b data-t="pathC"></b><span data-t="pathCs"></span></a>
          <a href="#partners"><b data-t="pathP"></b><span data-t="pathPs"></span></a>
        </div>
        <div class="hero-facts">
          <div><b id="fItems">—</b><span data-t="fItems"></span></div>
          <div><b id="fSecs">—</b><span data-t="fSecs"></span></div>
          <div><b id="fPromo">—</b><span data-t="fPromo"></span></div>
        </div>
      </div>
    </div>
    <div hidden><span id="clock"></span><div id="vf"></div></div>
  </section>

  <section class="block" style="padding-top:4px" data-page="home"><div class="wrap"><div class="why">
    <div><i><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></i><b data-t="w1"></b><span data-t="w1s"></span></div>
    <div><i><svg class="ico" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9 8 11 4.6-2 8-6 8-11V5z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></i><b data-t="w2"></b><span data-t="w2s"></span></div>
    <div><i><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg></i><b data-t="w3"></b><span data-t="w3s"></span></div>
    <div><i><svg class="ico" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></i><b data-t="w4"></b><span data-t="w4s"></span></div>
  </div></div></section>

  <section class="block" id="cats" style="padding-top:8px" data-page="home">
    <div class="wrap">
      <div class="sec-head"><div><h2 id="catsH"></h2></div><a href="#catalog" id="catsAll" style="color:var(--accent);font-weight:600;text-decoration:none"></a></div>
      <div class="cats" id="catsGrid"></div>
    </div>
  </section>

  <section class="block" id="product" data-page="product" style="padding-top:20px">
    <div class="wrap">
      <div class="crumbs" id="ppCrumbs"></div>
      <div class="pp" id="ppMain"></div>
      <div id="ppMore"></div>
    </div>
  </section>

  <section class="block" id="recentSec" data-page="home" hidden style="padding-top:8px">
    <div class="wrap"><div class="sec-head"><div><h2 id="recentH"></h2></div></div><div class="recent" id="recentRow"></div></div>
  </section>

  <section class="block" data-page="home" style="padding-top:8px"><div class="wrap"><div class="brands" id="brands"></div></div></section>

  <section class="block" id="promoStrip-sec" style="padding-top:8px" data-page="home">
    <div class="wrap">
      <div class="sec-head">
        <div><h2 data-t="promoH"></h2><p data-t="promoP"></p></div>
        <button class="ghost" id="allPromo" data-t="allPromo"></button>
      </div>
      <div class="promo-strip" id="promoStrip"></div>
    </div>
  </section>

  <section class="block" id="catalog" data-page="catalog" style="padding-top:20px">
    <div class="wrap">
      <div id="pbanner"></div><div class="crumbs" id="crumbs"></div><div class="sec-head"><div><h2 id="catTitle"></h2><p data-t="catP"></p></div></div>
      <div class="domains" id="domains" style="margin-bottom:18px"></div>
      <div class="cat">
        <aside class="rail" id="rail" aria-label="Sections"></aside>
        <div class="cat-main">
          <div class="toolbar">
            <span class="count" id="count"></span>
            <select class="sec-select" id="secSelect" aria-label="Section"></select>
            <select id="sort" aria-label="Sort">
              <option value="def" data-t="sDef"></option>
              <option value="asc" data-t="sAsc"></option>
              <option value="desc" data-t="sDesc"></option>
            </select>
          </div>
          <div class="filters" id="filters">
            <input type="number" id="fMin" min="0" step="1000" inputmode="numeric" aria-label="min">
            <input type="number" id="fMax" min="0" step="1000" inputmode="numeric" aria-label="max">
            <select id="fMp" aria-label="MP"></select>
            <label class="tg"><input type="checkbox" id="fDisc"><span id="fDiscL"></span></label>
            <button type="button" class="reset" id="fReset" hidden></button>
          </div>
          <div class="grid" id="grid"></div>
          <button class="showmore" id="more" hidden></button>
        </div>
      </div>
    </div>
  </section>

  <section class="block" id="services" data-page="services">
    <div class="wrap">
      <div class="sec-head banner"><div><h2 data-t="svH"></h2><p data-t="svP"></p></div></div>
      <div class="steps">
        <div><b data-t="s1"></b><span data-t="s1s"></span></div>
        <div><b data-t="s2"></b><span data-t="s2s"></span></div>
        <div><b data-t="s3"></b><span data-t="s3s"></span></div>
        <div><b data-t="s4"></b><span data-t="s4s"></span></div>
      </div>
    </div>
  </section>

  <section class="block" id="solutions" data-page="home services">
    <div class="wrap">
      <div class="sec-head"><div><h2 data-t="soH"></h2><p data-t="soP"></p></div></div>
      <div class="sol" id="solGrid"></div>
    </div>
  </section>

  <section class="block" id="calc" data-page="services">
    <div class="wrap">
      <div class="sec-head"><div><h2 data-t="cxH"></h2><p data-t="cxP"></p></div></div>
      <div class="calc">
        <div style="display:grid;gap:16px;align-content:start">
          <div class="field"><div class="rangev"><label for="cxCams" data-t="cxCams"></label><b id="cxCamsV"></b></div><input type="range" id="cxCams" min="1" max="64" value="4"></div>
          <div class="field"><label for="cxRes" data-t="cxRes"></label><select id="cxRes"><option value="2">2 MP (1080p)</option><option value="4" selected>4 MP (2K)</option><option value="5">5 MP</option><option value="6">6 MP</option><option value="8">8 MP (4K)</option></select></div>
          <div class="field"><div class="rangev"><label for="cxDays" data-t="cxDays"></label><b id="cxDaysV"></b></div><input type="range" id="cxDays" min="3" max="90" value="30"></div>
          <div class="field"><label data-t="cxMode"></label><div class="seg"><label><input type="radio" name="cxMode" value="1" checked><span data-t="cxCont"></span></label><label><input type="radio" name="cxMode" value="0.35"><span data-t="cxMotion"></span></label></div></div>
          <p class="note" style="margin:0" data-t="cxNote"></p>
        </div>
        <div class="res"><span class="label" style="color:inherit;opacity:.7" data-t="cxNeed"></span><b class="big" id="cxTB">—</b><span id="cxHint" style="font-size:13.5px;opacity:.85"></span><div class="minis" id="cxPick"></div></div>
      </div>
    </div>
  </section>

  <section class="block" id="projects" hidden data-page="services">
    <div class="wrap">
      <div class="sec-head"><div><h2 data-t="prH"></h2><p data-t="prP"></p></div></div>
      <div class="projects" id="projGrid"></div>
    </div>
  </section>

  <section class="block dark-sec" id="partners" data-page="partners">
    <div class="wrap partner">
      <div style="display:grid;gap:16px;align-content:start">
        <div><div class="label" data-t="ptEy"></div><h2 style="font-family:var(--f-display);font-size:24px;margin-top:8px" data-t="ptH"></h2><p class="note" style="font-size:15px" data-t="ptP"></p></div>
        <div class="pben">
          <div><i>֏</i><b data-t="pb1"></b><span data-t="pb1s"></span></div>
          <div><i>⌘</i><b data-t="pb2"></b><span data-t="pb2s"></span></div>
          <div><i>☎</i><b data-t="pb3"></b><span data-t="pb3s"></span></div>
          <div><i>⇄</i><b data-t="pb4"></b><span data-t="pb4s"></span></div>
        </div>
      </div>
      <div id="ptBox">
        <form class="lead" id="ptForm" novalidate>
          <h3 style="font-family:var(--f-display);font-size:20px" data-t="ptFH"></h3>
          <div class="fgrid">
            <div class="field"><label for="ptCompany" data-t="ptCompany"></label><input id="ptCompany" autocomplete="organization"></div>
            <div class="field"><label for="ptKind" data-t="ptKind"></label><select id="ptKind"></select></div>
            <div class="field"><label for="ptName" data-t="fName"></label><input id="ptName" autocomplete="name"></div>
            <div class="field"><label for="ptPhone" data-t="fPhone"></label><input id="ptPhone" type="tel" autocomplete="tel" placeholder="+374 __ ___ ___"></div>
            <div class="field"><label for="ptEmail">E-mail</label><input id="ptEmail" type="email" autocomplete="email"></div>
            <div class="field"><label for="ptCity" data-t="fCity"></label><input id="ptCity"></div>
          </div>
          <div class="field"><label for="ptComment" data-t="ptComment"></label><textarea id="ptComment"></textarea></div>
          <div class="err" id="ptErr" hidden></div>
          <button class="primary" type="submit" id="ptSubmit" data-t="ptSend" style="justify-self:start"></button>
        </form>
      </div>
    </div>
  </section>

  <section class="block" id="knowledge" data-page="knowledge">
    <div class="wrap">
      <div class="sec-head banner b-glass"><div><h2 data-t="knH"></h2><p data-t="knP"></p></div></div>
      <div class="arts" id="artGrid"></div>
    </div>
  </section>

  <section class="block" id="contact" data-page="contact">
    <div class="wrap contact">
      <div class="info">
        <h2 data-t="cH"></h2>
        <div id="infoRows" style="display:grid;gap:16px"></div>
        <div class="row"><span data-t="howH"></span>
          <ol><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li></ol>
        </div>
      </div>
      <div id="formBox">
        <form class="lead" id="leadForm" novalidate>
          <div><h3 style="font-family:var(--f-display);font-size:20px" data-t="fH"></h3><p class="note" data-t="fP" style="margin:6px 0 0"></p></div>
          <div class="field"><label data-t="fNeed"></label>
            <div class="seg" id="segService"></div>
          </div>
          <div class="fgrid">
            <div class="field"><label for="fName" data-t="fName"></label><input id="fName" autocomplete="name" required></div>
            <div class="field"><label for="fPhone" data-t="fPhone"></label><input id="fPhone" type="tel" autocomplete="tel" placeholder="+374 __ ___ ___" required></div>
            <div class="field"><label for="fEmail">E-mail</label><input id="fEmail" type="email" autocomplete="email"></div>
            <div class="field"><label for="fObject" data-t="fObject"></label><select id="fObject"></select></div>
            <div class="field"><label for="fWay" data-t="fWay"></label><select id="fWay"></select></div>
            <div class="field"><label for="fCity" data-t="fCity"></label><input id="fCity" autocomplete="address-level2"></div>
          </div>
          <div class="field"><label for="fComment" data-t="fComment"></label><textarea id="fComment"></textarea></div>
          <div class="attached" id="attached" hidden></div>
          <div class="err" id="fErr" hidden></div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button class="primary" type="submit" id="fSubmit" data-t="fSend"></button>
            <span class="note" data-t="fPriv"></span>
          </div>
        </form>
      </div>
    </div>
  </section>

</main>

    </div>
  </section>
  <section data-pane="products" hidden>
    <div class="sec-head"><div><h2 data-t="pH"></h2><p data-t="pP"></p></div><button class="primary" type="button" id="addItemBtn" data-t="addItem"></button></div>
    <div class="toolbar"><input id="pq" type="search" data-ph="pSearch" style="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 220px">
      <select id="pSec" aria-label="Section"></select>
      <select id="pFilter" aria-label="Filter"><option value="all" data-t="pfAll"></option><option value="edited" data-t="pfEdited"></option><option value="hidden" data-t="pfHidden"></option><option value="nophoto" data-t="pfNoPhoto"></option><option value="lowq" data-t="pfLow"></option><option value="added" data-t="pfAdded"></option></select>
      <span class="count" id="pCount" style="margin:0"></span></div>
    <div class="tablewrap"><table class="ptable"><thead><tr><th></th><th data-t="model"></th><th data-t="section"></th><th style="text-align:right" data-t="priceL"></th><th style="text-align:right" data-t="oldL2"></th><th data-t="status"></th><th></th></tr></thead><tbody id="pBody"></tbody></table></div>
    <button class="showmore" id="pMore" hidden></button>
  </section>
  <section data-pane="bot" hidden>
    <div class="sec-head"><div><h2 data-t="bH"></h2><p data-t="bP"></p></div><button class="ghost" type="button" id="testBot" data-t="testBot"></button></div>
    <form id="botForm" style="display:grid;gap:20px">
      <div class="panel"><h3 data-t="bGreetH"></h3><p class="note" style="margin:0" data-t="bGreetP"></p>
        <div class="field"><label for="gHy">Հայերեն</label><textarea id="gHy"></textarea></div>
        <div class="field"><label for="gRu">Русский</label><textarea id="gRu"></textarea></div>
        <div class="field"><label for="gEn">English</label><textarea id="gEn"></textarea></div>
        <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="gAuto"> <span data-t="bAuto"></span></label>
      </div>
      <div class="panel"><h3 data-t="bAboutH"></h3><p class="note" style="margin:0" data-t="bAboutP"></p>
        <div class="field"><textarea id="bAbout" style="min-height:130px" data-ph="bAboutPh"></textarea></div></div>

{id:"ip-vs-analog",title:{ru:"IP или аналоговая система: что выбрать",hy:"IP թե անալոգ համակարգ. ինչ ընտրել",en:"IP or analog CCTV: which to choose"},
body:{ru:"Аналоговые HD-камеры (Turbo HD) подключаются коаксиальным кабелем к видеорегистратору DVR. Это недорогой вариант и удобный, когда старую систему нужно обновить без замены кабелей.\n\nIP-камеры подключаются сетевым кабелем к регистратору NVR или PoE-коммутатору. По одному кабелю идут и видео, и питание. IP-камеры дают более высокое разрешение, умную аналитику (распознавание людей и машин) и проще расширяются.\n\nДля нового объекта мы обычно советуем IP: разница в цене небольшая, а возможностей больше. Если кабель уже проложен, аналог поможет сэкономить на монтаже.",
hy:"Անալոգ HD տեսախցիկները (Turbo HD) միանում են կոաքսիալ մալուխով DVR տեսաձայնագրիչին։ Սա մատչելի տարբերակ է և հարմար է, երբ հին համակարգը պետք է թարմացնել առանց մալուխները փոխելու։\n\nIP տեսախցիկները միանում են ցանցային մալուխով NVR ձայնագրիչին կամ PoE սվիչին։ Մեկ մալուխով փոխանցվում են և՛ պատկերը, և՛ սնուցումը։ IP տեսախցիկներն ապահովում են ավելի բարձր լուծաչափ, խելացի վերլուծություն (մարդկանց և մեքենաների ճանաչում) և ավելի հեշտ են ընդլայնվում։\n\nՆոր օբյեկտի համար սովորաբար խորհուրդ ենք տալիս IP. գնի տարբերությունը փոքր է, իսկ հնարավորություններն՝ ավելի շատ։ Եթե մալուխն արդեն անցկացված է, անալոգը կօգնի խնայել տեղադրման վրա։",
en:"Analog HD cameras (Turbo HD) connect to a DVR recorder with coaxial cable. It is an affordable option and handy when an old system needs upgrading without replacing the cables.\n\nIP cameras connect to an NVR recorder or a PoE switch with network cable. One cable carries both video and power. IP cameras give higher resolution, smart analytics (people and vehicle detection) and are easier to expand.\n\nFor a new site we usually recommend IP: the price difference is small and you get more. If cable is already in place, analog saves on installation."}},
{id:"archive",title:{ru:"Сколько дней хранится запись и какой нужен диск",hy:"Քանի օր է պահվում ձայնագրությունը և ինչ սկավառակ է պետք",en:"How long recordings are kept and which drive you need"},
body:{ru:"Объём архива зависит от трёх вещей: количества камер, разрешения и того, пишет ли система постоянно или только при движении.\n\nНапример, 4 камеры по 4 Мп при постоянной записи в H.265 занимают около 4 ТБ за 30 дней. Запись только по движению уменьшает объём в 2–3 раза.\n\nДля видеонаблюдения берите специальные диски (серии Hikvision VX1, Seagate SkyHawk): они рассчитаны на круглосуточную запись. Точный объём посчитайте в нашем калькуляторе архива.",
hy:"Արխիվի ծավալը կախված է երեք բանից՝ տեսախցիկների քանակից, լուծաչափից և նրանից, թե համակարգը ձայնագրում է անընդհատ, թե միայն շարժման դեպքում։\n\nՕրինակ՝ 4 տեսախցիկ 4 Մպ լուծաչափով, անընդհատ ձայնագրմամբ H.265 ձևաչափով, 30 օրում զբաղեցնում են մոտ 4 ՏԲ։ Միայն շարժման դեպքում ձայնագրումը ծավալը նվազեցնում է 2–3 անգամ։\n\nՏեսահսկման համար ընտրեք հատուկ սկավառակներ (Hikvision VX1, Seagate SkyHawk). դրանք նախատեսված են շուրջօրյա ձայնագրման համար։ Ճշգրիտ ծավալը հաշվեք մեր արխիվի հաշվիչով։",
en:"Archive size depends on three things: the number of cameras, the resolution, and whether the system records continuously or only on motion.\n\nFor example, 4 cameras at 4 MP recording continuously in H.265 take about 4 TB over 30 days. Recording only on motion cuts that by 2–3 times.\n\nFor CCTV, use surveillance drives (Hikvision VX1, Seagate SkyHawk series): they are built for round-the-clock recording. Work out the exact size in our archive calculator."}},
{id:"kit",title:{ru:"Из чего состоит система видеонаблюдения",hy:"Ինչից է բաղկացած տեսահսկման համակարգը",en:"What a CCTV system is made of"},
body:{ru:"Камера сама по себе не работает. Рабочая система — это:\n\n• камеры — уличные или внутренние, нужного разрешения;\n• видеорегистратор (NVR для IP, DVR для аналоговых) с достаточным числом каналов;\n• жёсткий диск для архива;\n• питание: PoE-коммутатор или регистратор с PoE для IP-камер, блок питания для аналоговых;\n• кабели и монтажные материалы.\n\nВ корзине на сайте мы подсказываем, чего не хватает. Стоимость кабелей и монтажа менеджер рассчитывает отдельно, по вашему объекту.",
hy:"Տեսախցիկն ինքնին չի աշխատում։ Աշխատող համակարգը ներառում է՝\n\n• տեսախցիկներ՝ արտաքին կամ ներքին, անհրաժեշտ լուծաչափով.\n• տեսաձայնագրիչ (NVR՝ IP-ի համար, DVR՝ անալոգի համար) բավարար ալիքներով.\n• կոշտ սկավառակ արխիվի համար.\n• սնուցում՝ PoE սվիչ կամ PoE-ով ձայնագրիչ IP տեսախցիկների համար, սնուցման բլոկ՝ անալոգի համար.\n• մալուխներ և տեղադրման նյութեր։\n\nԿայքի զամբյուղում հուշում ենք, թե ինչ է պակասում։ Մալուխների և տեղադրման արժեքը մենեջերը հաշվարկում է առանձին՝ ըստ Ձեր օբյեկտի։",
en:"A camera does not work on its own. A working system includes:\n\n• cameras, outdoor or indoor, at the right resolution;\n• a recorder (NVR for IP, DVR for analog) with enough channels;\n• a hard drive for the archive;\n• power: a PoE switch or a PoE recorder for IP cameras, a power supply for analog ones;\n• cables and mounting materials.\n\nThe cart on our site tells you what is missing. A manager quotes cables and installation separately for your site."}},
{id:"alarm",title:{ru:"Беспроводная или проводная сигнализация",hy:"Անլար թե լարային ազդանշանային համակարգ",en:"Wireless or wired alarm"},
body:{ru:"Беспроводная сигнализация (например, Hikvision AX PRO) ставится быстро и без ремонта: датчики работают от батарей и связываются с панелью по радио. Это хороший выбор для квартиры, дома и небольшого офиса.\n\nПроводная или гибридная система (AX Hybrid PRO) подходит для больших объектов и новостроек, где кабели можно проложить на этапе отделки. Она дешевле в обслуживании и не требует замены батарей.\n\nОбе системы присылают тревоги на телефон и могут включать сирену.",
hy:"Անլար համակարգը (օրինակ՝ Hikvision AX PRO) տեղադրվում է արագ և առանց վերանորոգման. տվիչներն աշխատում են մարտկոցներով և կապվում են վահանակի հետ ռադիոալիքով։ Լավ ընտրություն է բնակարանի, տան և փոքր գրասենյակի համար։\n\nԼարային կամ հիբրիդ համակարգը (AX Hybrid PRO) հարմար է մեծ օբյեկտների և նորակառույցների համար, որտեղ մալուխները կարելի է անցկացնել հարդարման փուլում։ Այն ավելի էժան է սպասարկման մեջ և չի պահանջում մարտկոցների փոխարինում։\n\nԵրկու համակարգերն էլ ահազանգերն ուղարկում են հեռախոսին և կարող են միացնել սիրենան։",
en:"A wireless alarm (for example, Hikvision AX PRO) installs quickly with no renovation: sensors run on batteries and talk to the panel by radio. It is a good choice for an apartment, a house or a small office.\n\nA wired or hybrid system (AX Hybrid PRO) suits large sites and new buildings, where cables can be laid during finishing. It costs less to maintain and needs no battery changes.\n\nBoth systems send alarms to your phone and can trigger a siren."}}];

function browserLang(){const ls=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||""]).map(x=>String(x).toLowerCase());
  for(const x of ls){if(x.startsWith("hy")) return "hy"; if(/^(ru|uk|be|kk)/.test(x)) return "ru"; if(x.startsWith("en")) return "en";} return "en";}
let lang=browserLang(); try{const l=localStorage.getItem("armsec-lang"); if(l&&T[l]) lang=l;}catch(e){}
function textLang(s){s=String(s||""); const hy=(s.match(/[\u0531-\u058F]/g)||[]).length, ru=(s.match(/[\u0400-\u04FF]/g)||[]).length, en=(s.match(/[A-Za-z]/g)||[]).length;
  if(hy>=ru&&hy>=en&&hy>0) return "hy"; if(ru>=en&&ru>0) return "ru"; if(en>3&&!/^[A-Za-z0-9\-\/ .()]+$/.test(s.trim())||en>12) return "en"; return lang;}

function itemObj(a,ix){return{ix,sec:a[0],m:a[1],g:a[2],sp:a[3],d:a[4],p:a[5],op:a[6],i:a[7],rub:a[8],perM:a[9]===1,k:SECS[a[0]].k+"|"+a[1]}}
function rebuild(){
  const map={}; OVR.forEach(o=>{if(o&&o.k) map[o.k]=o;});
  ITEMS=BASE.map((a,ix)=>{const it=itemObj(a,ix), o=map[it.k]; if(o){if(o.p!=null)it.p=o.p; if(o.op!=null)it.op=o.op; if(o.img)it.img=o.img; it.hidden=!!o.hidden; it.edited=true;} return it;});
  OVR.filter(o=>o&&o.add&&!o.deleted).forEach(o=>{const sec=SECS.findIndex(x=>x.k===o.sec); if(sec<0) return; ITEMS.push({ix:ITEMS.length,sec,m:o.m,g:o.g||"",sp:o.sp||"",d:o.d||"",p:+o.p||0,op:+o.op||0,i:"",img:o.img||"",rub:0,perM:false,k:o.k,added:true,hidden:!!o.hidden});});
  buildHay();
}

function fillSelect(sel,arr){const v=sel.selectedIndex; sel.innerHTML=arr.map((a,i)=>`<option value="${i}">${esc(a)}</option>`).join(""); sel.selectedIndex=v>=0?v:0;}

/* ---------- catalog render ---------- */
function secName(i){return SECS[i]?SECS[i].n[{hy:0,ru:1,en:2}[lang]]:""}
function secDomain(i){return SECS[i]?SECS[i].d:""}
function normalize(s){return String(s).toLowerCase().replace(/ё/g,"е").replace(/[()\[\],]/g," ")}
let HAY=[];
function buildHay(){HAY=ITEMS.map(it=>normalize([it.m,it.g,it.sp,it.d,...SECS[it.sec].n,SYN[SECS[it.sec].k]||"",it.rub?"рубеж rubezh":"hikvision"].join(" ")));}
function searchIdx(q,pool){
  const toks=normalize(q).split(/\s+/).filter(x=>x.length>1);
  if(!toks.length) return pool;
  const res=[];
  for(const ix of pool){const h=HAY[ix]; let sc=0,all=true;
    for(const tk of toks){const stem=tk.length>5?tk.slice(0,tk.length-2):tk; if(h.includes(tk)) sc+=2; else if(h.includes(stem)) sc+=1; else all=false;}
    if(sc>0) res.push([ix,sc+(all?5:0)+(normalize(ITEMS[ix].m).includes(normalize(q))?10:0)]);}
  res.sort((a,b)=>b[1]-a[1]); return res.map(r=>r[0]);
}
function currentList(){
  let pool=ITEMS.filter(vis).map(it=>it.ix);
  if(view.dom==="promo") pool=pool.filter(ix=>ITEMS[ix].sec===PROMO_SEC);
  else { pool=pool.filter(ix=>ITEMS[ix].sec!==PROMO_SEC); if(view.secs) pool=pool.filter(ix=>view.secs.includes(SECS[ITEMS[ix].sec].k)); if(view.sec>=0) pool=pool.filter(ix=>ITEMS[ix].sec===view.sec); }
  if(view.q) pool=searchIdx(view.q,pool);
  if(typeof renderFilters==="function"){renderFilters(pool); pool=applyFilters(pool);}
  if(view.sort==="asc") pool=[...pool].sort((a,b)=>ITEMS[a].p-ITEMS[b].p);
  if(view.sort==="desc") pool=[...pool].sort((a,b)=>ITEMS[b].p-ITEMS[a].p);
  return pool;
}

   ${it.d?`<div class="desc">${esc(it.d)}</div>${it.d.length>110?`<button class="more" data-more>${esc(t("more"))}</button>`:""}`:""}
   <div class="foot"><div>${it.op?`<div class="old">${fmt(it.op)}</div>`:""}<div class="price${it.op?" p":""}">${fmt(it.p)}${it.perM?`<small>${t("perM")}</small>`:""}</div></div>
   <button class="add${inEst?" in":""}" data-add="${it.ix}">${esc(inEst?t("added"):t("add"))}</button></div></div></article>`;

function renderGrid(){

  if(!list.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1">${esc(t("noRes"))}</div>`;$("#more").hidden=true;return;}
  let html="",lastKey=null; const grouped=view.sort==="def"&&!view.q;

async function chatStream(body,bubble){
  const r=await fetch("/api/chat?stream=1",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok||!r.body||!(r.headers.get("content-type")||"").includes("event-stream")){let d=null; try{d=await r.json();}catch(e){} const er=new Error((d&&d.error)||"http_"+r.status); er.status=r.status; er.data=d; throw er;}
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf="", done=null, chatId=null;
  while(true){const {value,done:end}=await rd.read(); if(end) break; buf+=dec.decode(value,{stream:true});
    let i; while((i=buf.indexOf("\n\n"))>=0){const line=buf.slice(0,i).replace(/^data: /,""); buf=buf.slice(i+2); let ev; try{ev=JSON.parse(line);}catch(e){continue;}
      if(ev.chatId){chatId=ev.chatId; setChat(chatId);}
      if(ev.type==="status"){const lbl=(ST[ev.tool]||["…","…","…"])[{hy:0,ru:1,en:2}[lang]]; bubble.innerHTML=`<span class="bot-status">${esc(lbl)}</span>`; scrollMsgs();}
      else if(ev.type==="done") done=ev;
      else if(ev.type==="error"){const er=new Error("ai_failed"); er.status=502; er.data={chatId}; throw er;}}}
  if(!done){const er=new Error("ai_failed"); er.status=502; er.data={chatId}; throw er;}
  return done;
}
function keyIx(k){const it=ITEMS.find(i=>i.k===k); return it?it.ix:-1;}
async function ask(text){
  text=text.trim(); if(!text||bot.busy) return; addMsg("u",text); $("#botIn").value=""; $("#quick").hidden=true;
  const cart=estLines().map(l=>({k:l.it.k,q:l.q}));
  if(bot.ai){
    bot.busy=true; const bubble=addMsg("a thinking",t("thinking"));
    try{
      const r=await chatStream({chatId:bot.chatId,visitor:bot.visitor,lang,message:text,cart,quote:bot.quote||null},bubble);
      setChat(r.chatId); bubble.classList.remove("thinking"); bubble.textContent=r.text; scrollMsgs();
      const extra=[]; let quoteCard=null;
      for(const a of (r.actions||[])){
        if(a.type==="add"){const ix=keyIx(a.k); if(ix>=0){est[ix]=(est[ix]||0)+(+a.qty||1); extra.push(ix);}}
        else if(a.type==="clear"){est={};}
        else if(a.type==="open_form"){openLeadForm({comment:a.comment,service:a.service});}
        else if(a.type==="quote"){bot.quote=a.quote; quoteCard=a.quote;}
        else if(a.type==="open_partner"){nav("partners");}
        else if(a.type==="lead"){est={}; bot.quote=null;}
      }
      saveEst(); renderAttached();
      if((r.actions||[]).some(a=>a.type==="add")) setTimeout(openEst,600);
      (r.products||[]).forEach(k=>{const ix=keyIx(k); if(ix>=0&&!extra.includes(ix)) extra.push(ix);});
      if(quoteCard) renderQuote(quoteCard); else addMinis([...new Set([...extra,...mentioned(r.text)])]);
    }catch(e){
      if(e.data&&e.data.chatId) setChat(e.data.chatId);
      if(e.status===503) bot.ai=false;
      bubble.remove(); $("#botMode").textContent=bot.ai?t("modeAI"):t("modeLocal");
      quickAnswer(text,e.status===503);
    }
    bot.busy=false; return;
  }
  quickAnswer(text,false,true);
}
function quickAnswer(text,silent,logUser){
  bot.log=[]; localAnswer(text,silent); const msgs=bot.log; bot.log=null;
  if(logUser) msgs.unshift({role:"user",content:text});
  if(msgs.length) api("/api/chat/log",{method:"POST",json:{chatId:bot.chatId,visitor:bot.visitor,lang,messages:msgs}}).then(r=>r&&r.chatId&&setChat(r.chatId)).catch(()=>{});
}
function faqMatch(text){
  const tok=x=>normalize(x).split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>2).map(w=>w.length>5?w.slice(0,w.length-2):w);
  const a=new Set(tok(text)); if(!a.size) return null; let best=null,bs=0;
  for(const f of (BOT.faq||[])){if(!f.q||!f.a) continue; const b=tok(f.q); if(!b.length) continue; const hit=b.filter(w=>a.has(w)||[...a].some(x=>x.startsWith(w)||w.startsWith(x))).length; const sc=hit/Math.max(2,Math.min(b.length,a.size)); if(sc>bs){bs=sc;best=f;}}
  return bs>=0.5?best:null;
}
function localAnswer(text,silent){
  const n=normalize(text); const saved=lang; lang=textLang(text);
  try{ localAnswerIn(text,n,silent); } finally { lang=saved; }
}

  if(/заявк|հայտ|request|перезвон|позвон|связат|call me|contact me/.test(n)){openLeadForm({comment:text}); addMsg("a",t("lForm")); return;}

  const q=n.split(/\s+/).filter(w=>w.length>1&&!stop.test(w)&&!/^\d+$/.test(w)).join(" ");

const num=v=>{const n=parseFloat(String(v).replace(/[^\d.]/g,"")); return isFinite(n)?Math.round(n):0;};
async function writeOvr(mut){
  const list=mut(OVR.slice()); await api("/api/admin/overrides",{method:"PUT",json:{list}}); OVR=list; rebuild(); refreshAll();
}
async function saveEditor(action){
  const it=edIx==null?null:ITEMS[edIx], er=$("#edErr");
  const p=num($("#edPrice").value), op=num($("#edOld").value), hide=$("#edHide").checked;
  let img=it&&it.img?it.img:"";
  const purl=($("#edUrl").value||"").trim();
  if(purl&&action==="save"&&!($("#edFile").files&&$("#edFile").files[0])){
    er.hidden=false; er.textContent=t("uploading");
    try{const up=await api("/api/admin/fetch-image",{method:"POST",json:{url:purl}}); img=up.url; er.hidden=true;}catch(e){er.textContent=t("urlErr"); return;}
  }
  const file=$("#edFile").files&&$("#edFile").files[0];
  if(file&&action==="save"){
    er.hidden=false; er.textContent=t("uploading");
    try{const up=await api("/api/admin/upload",{method:"POST",headers:{"content-type":file.type||"image/jpeg"},body:file}); img=up.url;}catch(e){er.textContent=t("saveErr"); return;}
    er.hidden=true;
  }
  try{
    if(!it||it.added){
      const m=$("#edModel").value.trim(); if(action!=="del"&&(!m||!p)){er.hidden=false; er.textContent=t("needMP"); return;}
      const k=it?it.k:"add:"+Date.now().toString(36);
      await writeOvr(list=>{list=list.filter(o=>o.k!==k); if(action!=="del") list.push({k,add:true,sec:SECS[+$("#edSec").value].k,m,d:$("#edDesc").value.trim(),p,op:op>p?op:0,img,hidden:hide}); return list;});
    }else{
      await writeOvr(list=>{list=list.filter(o=>o.k!==it.k);
        if(action==="del") list.push({k:it.k,hidden:true});
        else if(action!=="reset") list.push({k:it.k,p:p||it.p,op:op>(p||it.p)?op:0,img,hidden:hide});
        return list;});
    }
    $("#editor").hidden=true;
  }catch(err){er.hidden=false; er.textContent=t("saveErr");}
}

const BITRATE={2:2,4:3,5:3.5,6:4,8:6};

    let tb=0; const m=(it.d||"").match(/(\d+)\s*T\s*B/i)||(it.d||"").match(/(\d+)\s*TB/i); if(m) tb=+m[1]; else {const s=it.m.match(/^ST(\d+)/); if(s) tb=Math.round(+s[1]/1000);}
    return {it,tb};}).filter(x=>x.tb>0).sort((a,b)=>a.tb-b.tb||a.it.p-b.it.p);

function calcArchive(){
  if(!$("#cxCams")) return;
  const cams=+$("#cxCams").value, res=+$("#cxRes").value, days=+$("#cxDays").value, mode=+(document.querySelector('input[name=cxMode]:checked')||{value:1}).value;
  $("#cxCamsV").textContent=cams; $("#cxDaysV").textContent=days;
  const tb=cams*BITRATE[res]*1e6/8*86400*days*mode/1e12*1.1;
  $("#cxTB").textContent=(tb<1?tb.toFixed(2):tb.toFixed(1)).replace(".",",")+(lang==="hy"?" ՏԲ":lang==="en"?" TB":" ТБ");
  const hdd=hddList(), pick=$("#cxPick"); pick.innerHTML="";
  if(!hdd.length){$("#cxHint").textContent=""; return;}
  let one=hdd.find(x=>x.tb>=tb);
  if(one){$("#cxHint").textContent=t("cxFit")(1,one.tb); addMinisTo(pick,[one.it.ix]); return;}
  const big=hdd.filter(x=>x.tb>=8).sort((a,b)=>a.it.p/a.tb-b.it.p/b.tb)[0]||hdd[hdd.length-1];
  const n=Math.ceil(tb/big.tb);

  else $("#cxHint").textContent=t("cxBig");
}

(function heroArt(){
  const hx=document.querySelector(".hx"), art=document.querySelector(".hx-art"), txt=document.querySelector(".hx-txt"); if(!hx||!art||!txt) return;
  function size(){const H=hx.clientHeight, W=hx.clientWidth, hr=hx.getBoundingClientRect();
    if(W<=820){const S=Math.min(W,H); Object.assign(art.style,{width:S+"px",height:S+"px",top:"0px",right:((W-S)/2)+"px"}); return;}
    const tr=txt.getBoundingClientRect().right-hr.left, avail=W-tr+40, S=Math.max(300,Math.min(H,avail,860));
    Object.assign(art.style,{width:S+"px",height:S+"px",top:Math.max(0,(H-S)/2)+"px",right:"0px"});}
  size(); window.addEventListener("resize",size); if(window.ResizeObserver) new ResizeObserver(size).observe(hx);
  const still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!still) hx.addEventListener("mousemove",e=>{const r=hx.getBoundingClientRect(), dx=(e.clientX-r.left)/r.width-.5, dy=(e.clientY-r.top)/r.height-.5; art.style.transform=`translate(${dx*-18}px,${dy*-12}px)`;});
  hx.addEventListener("mouseleave",()=>{art.style.transform="";});
})();

function buildKit(n){

  const cams=sec("hik:IP 1.0").filter(i=>/4\s*MP/i.test(i.sp+" "+i.g)).sort((a,b)=>a.p-b.p);
  const cam=cams[Math.min(2,cams.length-1)]; if(!cam) return null;
  const nvr=sec("hik:NVR").filter(i=>chOf(i)>=n).sort((a,b)=>chOf(a)-chOf(b)||a.p-b.p)[0];
  const tb=n<=4?2:n<=8?4:n<=16?6:8; const hdd=sec("hik:Memory").filter(i=>new RegExp("^DS"+tb+"0HK").test(i.m))[0]||sec("hik:Memory").filter(i=>!/^HS-/.test(i.m))[0];
  const sw=sec("hik:Swich").filter(i=>portsOf(i)>=n).sort((a,b)=>portsOf(a)-portsOf(b)||a.p-b.p)[0];
  const lines=[[cam,n],[nvr,1],[hdd,1],[sw,1]].filter(x=>x[0]).map(([it,q])=>({k:it.k,model:it.m,name:(it.g||secName(it.sec)).slice(0,80),qty:q,price:it.p,sum:it.p*q}));
  return {title:({hy:`Տեսահսկում ${n} տեսախցիկի համար`,ru:`Видеонаблюдение на ${n} камер`,en:`CCTV for ${n} cameras`})[lang],lines,total:lines.reduce((s,l)=>s+l.sum,0)};
}
function kitIntent(n0){

  const m=n0.match(/(\d{1,2})\s*(?:-?х|x|шт|камер|camera|cam|տեսախցիկ)/)||n0.match(/(?:на|for|для)\s*(\d{1,2})\b/)||n0.match(/\b(\d{1,2})\b/);
  const words={"одн":1,"дв":2,"тр":3,"четыр":4,"пят":5,"шест":6,"восем":8,"one":1,"two":2,"three":3,"four":4,"five":5,"six":6,"eight":8};
  if(m) return Math.min(32,Math.max(1,+m[1]));

}

function camPool(loc,mp){

  const gb=e.target.closest("[data-go]"); if(gb){nav(gb.dataset.go); return;}
  const sb=e.target.closest("[data-sub]"); if(sb){setView({sec:+sb.dataset.sub}); return;}
  const dm=e.target.closest("[data-dom]"); if(dm){setView({dom:dm.dataset.dom,sec:-1}); return;}
  const sc=e.target.closest("[data-sec]"); if(sc){setView({sec:+sc.dataset.sec,dom:secDomain(+sc.dataset.sec)}); return;}
  const qd=e.target.closest("[data-q]"); if(qd){const ix=qd.dataset.q; est[ix]=Math.max(0,(est[ix]||0)+ +qd.dataset.d); if(!est[ix]) delete est[ix]; saveEst(); renderAttached(); return;}
  const rm=e.target.closest("[data-rm]"); if(rm){delete est[rm.dataset.rm]; saveEst(); renderAttached(); return;}
  const qk=e.target.closest("[data-qk]"); if(qk){const i=+qk.dataset.qk; if(i===3&&!bot.ai){ask(t("q")[3]);} else ask(t("q")[i]); return;}
  const lb=e.target.closest("[data-lang]"); if(lb){lang=lb.dataset.lang; try{localStorage.setItem("armsec-lang",lang);}catch(err){} applyLang(); return;}
});
